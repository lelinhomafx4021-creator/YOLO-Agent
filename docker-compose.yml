services:
  postgres:
    image: postgres:16-alpine
    container_name: yolops-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: yolops
      POSTGRES_PASSWORD: yolops123
      POSTGRES_DB: yolops
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yolops -d yolops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
